<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>astrocumbia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsla(232, 73%, 65%, 1);
      background: -webkit-linear-gradient(90deg, hsla(232, 73%, 65%, 1) 0%, hsla(279, 33%, 48%, 1) 100%);
      background: -moz-linear-gradient(90deg, hsla(232, 73%, 65%, 1) 0%, hsla(279, 33%, 48%, 1) 100%);
      background: linear-gradient(90deg, hsla(232, 73%, 65%, 1) 0%, hsla(279, 33%, 48%, 1) 100%);
      filter: progid:DXImageTransform.Microsoft.gradient(startColorstr="#6274E7", endColorstr="#8752A3", GradientType=1);
      font-family: 'Courier New', Courier, monospace;
      color: white;
      font-size: 20px;
      padding: 1rem;
    }

    pre {
      line-height: 1.5;
      white-space: pre;
    }

    #speech {
      display: inline-block;
      width: 22ch;
      overflow: hidden;
      vertical-align: bottom;
    }

    .token {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .token.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <pre id="cow"></pre>
  </div>

  <script>
    const tokens = [
      { text: " cu",      wait: 1300 },
      { text: " cu",      wait:  800 },
      { text: " cu",      wait:  500 },
      { text: " cumbia",  wait:  300 },
      { text: " 💃",      wait:  200 },
      { text: "🕺",       wait: 10000 },
    ];

    const cow = document.getElementById("cow");

    const tokenSpans = tokens.map(t => {
      const s = document.createElement("span");
      s.className = "token";
      s.textContent = t.text;
      return s;
    });


    cow.innerHTML =
      " ----------------------\n" +
      "&lt;<span id='speech'></span>&gt;\n" +
      " ----------------------\n" +
      "        \\   ^__^\n" +
      "         \\  (oo)\\_______\n" +
      "            (__)\\       )\\/\\\n" +
      "                ||----w |\n" +
      "                ||     ||";

    const speech = document.getElementById("speech");
    tokenSpans.forEach(s => speech.appendChild(s));

    let step = 0;

    function animate() {
      // Fade in current token
      tokenSpans[step].classList.add("visible");
      const wait = tokens[step].wait;
      step++;

      if (step < tokens.length) {
        setTimeout(animate, wait);
      } else {
        // All visible — wait, then reset and loop
        setTimeout(() => {
          tokenSpans.forEach(s => s.classList.remove("visible"));
          step = 0;
          // Small pause before restarting so the fade-out is visible
          setTimeout(animate, 800);
        }, wait);
      }
    }

    animate();
  </script>
</body>
</html>
